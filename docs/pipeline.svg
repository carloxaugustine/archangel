<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 180" width="990" height="180" role="img" aria-labelledby="pt pd" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace">
<title id="pt">Pipeline</title><desc id="pd">Six stages: find, rank, tailor, approve, submit, follow up. Nothing passes the approve stage without you.</desc>
<style>.p{animation:m 6s linear infinite}@keyframes m{from{transform:translateX(0)}to{transform:translateX(920px)}}@media (prefers-reduced-motion:reduce){.p{animation:none}}</style>
<rect width="990" height="180" fill="#0000AA"/><rect x="6" y="6" width="978" height="168" fill="none" stroke="#FFFF55" stroke-width="2"/>
<rect x="26" y="34" width="138" height="112" fill="#000055" stroke="#55FFFF" stroke-width="3"/><rect x="26" y="34" width="138" height="30" fill="#55FFFF"/><text x="95.0" y="55" text-anchor="middle" fill="#000000" font-weight="700" font-size="16">01 FIND</text><text x="95.0" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">boards, lists,</text><text x="95.0" y="116" text-anchor="middle" fill="#AAAAAA" font-size="14">alerts, scout</text><path d="M168 84h10v-6l8 12-8 12v-6h-10z" fill="#FFFF55"/><rect x="186" y="34" width="138" height="112" fill="#000055" stroke="#55FF55" stroke-width="3"/><rect x="186" y="34" width="138" height="30" fill="#55FF55"/><text x="255.0" y="55" text-anchor="middle" fill="#000000" font-weight="700" font-size="16">02 RANK</text><text x="255.0" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">dedupes, then</text><text x="255.0" y="116" text-anchor="middle" fill="#AAAAAA" font-size="14">scores fit</text><path d="M328 84h10v-6l8 12-8 12v-6h-10z" fill="#FFFF55"/><rect x="346" y="34" width="138" height="112" fill="#000055" stroke="#FFFF55" stroke-width="3"/><rect x="346" y="34" width="138" height="30" fill="#FFFF55"/><text x="415.0" y="55" text-anchor="middle" fill="#000000" font-weight="700" font-size="16">03 TAILOR</text><text x="415.0" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">resume from</text><text x="415.0" y="116" text-anchor="middle" fill="#AAAAAA" font-size="14">your bullets</text><path d="M488 84h10v-6l8 12-8 12v-6h-10z" fill="#FFFF55"/><rect x="506" y="34" width="138" height="112" fill="#000055" stroke="#FF5555" stroke-width="3"/><rect x="506" y="34" width="138" height="30" fill="#FF5555"/><text x="575.0" y="55" text-anchor="middle" fill="#000000" font-weight="700" font-size="16">04 APPROVE</text><text x="575.0" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">you edit,</text><text x="575.0" y="116" text-anchor="middle" fill="#AAAAAA" font-size="14">approve, skip</text><path d="M648 84h10v-6l8 12-8 12v-6h-10z" fill="#FFFF55"/><rect x="666" y="34" width="138" height="112" fill="#000055" stroke="#FF55FF" stroke-width="3"/><rect x="666" y="34" width="138" height="30" fill="#FF55FF"/><text x="735.0" y="55" text-anchor="middle" fill="#000000" font-weight="700" font-size="16">05 SUBMIT</text><text x="735.0" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">Greenhouse,</text><text x="735.0" y="116" text-anchor="middle" fill="#AAAAAA" font-size="14">Lever. Rest: you</text><path d="M808 84h10v-6l8 12-8 12v-6h-10z" fill="#FFFF55"/><rect x="826" y="34" width="138" height="112" fill="#000055" stroke="#FFFFFF" stroke-width="3"/><rect x="826" y="34" width="138" height="30" fill="#FFFFFF"/><text x="895.0" y="55" text-anchor="middle" fill="#000000" font-weight="700" font-size="16">06 FOLLOW</text><text x="895.0" y="94" text-anchor="middle" fill="#FFFFFF" font-size="14">drafts you</text><text x="895.0" y="116" text-anchor="middle" fill="#AAAAAA" font-size="14">send yourself</text><rect class="p" x="26" y="156" width="18" height="8" fill="#FFFF55"/></svg>
# Internship agent settings. /internship-setup writes the [targets] and [scoring] parts for your field.

[submit]
# While true, the agent fills forms completely but stops before pressing Submit.
# Run a few dry runs and check them before setting this to false.
dry_run = true
# Nothing is submitted until you approve it on the dashboard's Approve tab. Keep this on.
require_approval = true
# Approved applications submitted per day, best fit first, spaced out.
max_auto_submits_per_day = 10
submit_spacing_minutes = 3
# Minimum score for a job to be prepared automatically.
min_score = 6
# When false, any required essay sends the application to you instead of being drafted.
auto_submit_essays = true
# The only application systems the agent ever submits. Everything else is fill and hand off.
auto_submit_ats = ["greenhouse", "lever"]
# Terms that may be prepared and submitted. Others stay on the shortlist.
auto_submit_terms = ["summer"]
# Each application already open at a company raises the score a new posting there needs.
focus_step = 2
# Cover letters: written only when the application requires one.
cover_letter = "only_when_required"

[targets]
term_label = "Summer 2027"          # exact wording the GitHub lists use
season = "summer"
year = "2027"                       # postings naming this year score higher
stale_terms = "fall 2026|summer 2026"   # postings naming these score lower
prefer_location = ""                # regex of places to rank higher, e.g. "california|,\\s*CA\\b"
prefer_bonus = 2
penalty_categories = []             # scoring categories to rank lower
penalty = 3
home_area = ""                      # regex of nearby places, e.g. "austin|round rock|cedar park"
github_lists = ["SimplifyJobs/Summer2027-Internships", "vanshb03/Summer2027-Internships"]

[scoring]
# Starter set for mechanical and aerospace roles. /internship-setup replaces it for your field.
skills = ["fea", "finite element", "ansys", "solidworks", "matlab", "simulink", "python", "c++", "thermal", "heat transfer",
          "composite", "cfd", "structural", "structures", "gd&t", "propulsion", "linux", "test", "rocket", "spacecraft",
          "satellite", "flight", "cad", "fluid", "controls", "analysis"]
list_include = 'mechanical|aerospace|aeronaut|astronaut|thermal|structur|propulsion|manufactur|materials?\b|composite|test|gnc|guidance|flight|hardware|rocket|space|avionics|integration|reliability|design engineer'
list_exclude = 'software|silicon|asic|\bfpga\b|\bdata\b|analytics|digital|\bai\b|\bml\b|machine learning|cloud|security|network|firmware|\bit\b|product|business|marketing|sales|finance|chip|semiconductor|\brf\b|electrical|sdet'

[[scoring.category]]
name = "controls"
pattern = 'guidance|navigation|\bgnc\b|gn&c|\bcontrols?\b|flight software|autonomy|estimation|attitude|adcs|flight dynamics'
weight = 4

[[scoring.category]]
name = "thermal"
pattern = 'thermal|heat transfer|thermodynamic|cryogenic'
weight = 4

[[scoring.category]]
name = "systems"
pattern = 'systems eng|system eng|integration|\bi&t\b|\btest\b|mission|verification|reliability'
weight = 3

[[scoring.category]]
name = "other_eng"
pattern = 'electrical|software|\brf\b|firmware|embedded|electronics|\bdata\b|machine learning|\bai\b|cyber|security|network'
weight = 0

[[scoring.category]]
name = "mechanical"
pattern = 'mechanical|structur|design eng|\bcad\b|propulsion|manufactur|materials?|composite|stress|launch|vehicle|hardware|aerospace|airframe|engine|fluids'
weight = 4

[filters]
# Postings whose title contains any of these are dropped.
exclude_title = ["phd", "mba", "master", "finance", "accounting", "marketing", "recruit", "talent acquisition", "legal", "sales", "people", "human resources", "communications", "business", "procurement", "buyer", "supply chain", "it support", "data entry", "design intern - graphic"]
us_only = true

